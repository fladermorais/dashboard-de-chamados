<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard de Chamados</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        canvas { margin-bottom: 40px; }
        .container { display: grid; gap: 40px; }
    </style>
    
    <script src="./script.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="card">
                <div class="card-header">
                    <h1>Dashboard de Chamados: <span id="dataAtual"></span></h1>
                </div>
            </div>
        </div>
    </div>  
    
    <div class="container">
        <div class="row">
            <div class="col-md-3">
                <h3 class="text-center">Fila</h3>
                <canvas id="chartFila"></canvas>
                <div id="tableFila"></div>
            </div>
            <div class="col-md-3">
                <h3 class="text-center">Status</h3>
                <canvas id="chartStatus"></canvas>
                <div id="tableStatus"></div>
            </div>
            <div class="col-md-3">
                <h3 class="text-center">Atendente</h3>
                <canvas id="chartAtendente"></canvas>
                <div id="tableAtendente"></div>
            </div>
            <div class="col-md-3">
                <h3 class="text-center">Tempo</h3>
                <canvas id="chartTempo"></canvas>
                <div id="tableTempo"></div>
            </div>  
        </div>
    </div>  
    
</body>
</html>
